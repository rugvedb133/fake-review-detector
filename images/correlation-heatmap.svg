    @import url("https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&amp;display=swap");

    :root {
      color-scheme: dark;
    }

    text {
      fill: #F1FDF6;
      font-family: "Oxygen", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }

    .head {
      font-size: 16px;
      font-weight: 700;
    }

    .pct {
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }

    .big {
      font-size: 30px;
      font-weight: 700;
      text-anchor: middle;
    }

    .mid {
      fill: #B9E3CC;
      font-size: 14px;
      text-anchor: middle;
    }

    .key {
      fill: #B9E3CC;
      font-size: 14px;
    }

    .tick {
      fill: #B9E3CC;
      font-size: 13px;
      text-anchor: middle;
    }

    .seg {
      stroke: #072F25;
      stroke-width: 2;
    }

    .grid {
      stroke: #A4EFC1;
      stroke-opacity: 0.18;
    }

    .zero {
      stroke: #B9E3CC;
      stroke-width: 1.5;
    }
  </style>
