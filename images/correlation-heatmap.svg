<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 482" width="720" height="482" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Correlation heatmap of simple text features and the fake label</title>
  <desc id="d">Heatmap of Pearson correlations for seven features over 1,600 reviews. The fake label correlates most strongly with digit count at -0.31. Its correlation with characters, non-word characters, words and sentences is between -0.03 and -0.09, and with polarity 0.00. Characters, non-word characters and words are almost perfectly correlated with each other.</desc>
