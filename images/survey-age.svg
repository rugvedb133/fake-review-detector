<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" width="720" height="345" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Age of the survey respondents</title>
  <desc id="d">Doughnut chart. 85.9% of the 156 respondents are aged 16 to 25, which includes 2 who left age blank. The other 14.1% (22 people) are shown in a second doughnut: 12 aged 45 and above, 6 aged 26 to 35, 2 aged 15 and below and 2 aged 36 to 45.</desc>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&amp;display=swap");

    :root {
      color-scheme: dark;
    }

    text {
      fill: #F1FDF6;
      font-family: "Oxygen", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }

    .head {
      font-size: 16px;
      font-weight: 700;
    }

    .pct {
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }

    .big {
      font-size: 30px;
      font-weight: 700;
      text-anchor: middle;
    }

    .mid {
      fill: #B9E3CC;
      font-size: 14px;
      text-anchor: middle;
    }

    .key {
      fill: #B9E3CC;
      font-size: 14px;
    }

    .tick {
      fill: #B9E3CC;
      font-size: 13px;
      text-anchor: middle;
    }

    .seg {
      stroke: #072F25;
      stroke-width: 2;
    }

    .grid {
      stroke: #A4EFC1;
      stroke-opacity: 0.18;
    }

    .zero {
      stroke: #B9E3CC;
      stroke-width: 1.5;
    }
  </style>
  <text class="head" x="0" y="22">Age of the 156 respondents</text>
  <g><title>16-25: 134 of 156 (85.9%), including 2 who left age blank</title><path class="seg" d="M268.4 236.4A120 120 0 1 1 268.4 133.6L226.9 153.3A74 74 0 1 0 226.9 216.7Z" fill="#A4EFC1"/></g>
  <g><title>Other ages: 22 of 156 (14.1%)</title><path class="seg" d="M268.4 133.6A120 120 0 0 1 268.4 236.4L226.9 216.7A74 74 0 0 0 226.9 153.3Z" fill="#C5D3CD"/></g>
  <line x1="268.4" y1="133.6" x2="450" y2="113" stroke="#B9E3CC" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="268.4" y1="236.4" x2="450" y2="257" stroke="#B9E3CC" stroke-opacity="0.6" stroke-width="1.5"/>
  <text class="big" x="160" y="193">85.9%</text>
  <text class="mid" x="160" y="215">aged 16-25</text>
  <g><title>45 and above: 12 of 156 (7.7%)</title><path class="seg" d="M450.0 113.0A72 72 0 1 1 429.7 254.1L437.6 227.2A44 44 0 1 0 450.0 141.0Z" fill="#79C3A0"/></g>
  <text class="pct" x="507.4" y="198.3" style="fill:#072F25">12</text>
  <g><title>26-35: 6 of 156 (3.8%)</title><path class="seg" d="M429.7 254.1A72 72 0 0 1 384.5 155.1L410.0 166.7A44 44 0 0 0 437.6 227.2Z" fill="#4E9F83"/></g>
  <text class="pct" x="397.2" y="214.1" style="fill:#072F25">6</text>
  <g><title>15 and below: 2 of 156 (1.3%)</title><path class="seg" d="M384.5 155.1A72 72 0 0 1 411.1 124.4L426.2 148.0A44 44 0 0 0 410.0 166.7Z" fill="#2F7F67"/></g>
  <g><title>36-45: 2 of 156 (1.3%)</title><path class="seg" d="M411.1 124.4A72 72 0 0 1 450.0 113.0L450.0 141.0A44 44 0 0 0 426.2 148.0Z" fill="#F1FDF6"/></g>
  <text class="big" x="450" y="189" style="font-size:22px">14.1%</text>
  <text class="mid" x="450" y="207" style="font-size:13px">other ages</text>
  <rect x="548" y="140" width="14" height="14" rx="3" fill="#79C3A0"/><text class="key" x="568" y="152">45 and above (12)</text>
  <rect x="548" y="166" width="14" height="14" rx="3" fill="#4E9F83"/><text class="key" x="568" y="178">26-35 (6)</text>
  <rect x="548" y="192" width="14" height="14" rx="3" fill="#2F7F67"/><text class="key" x="568" y="204">15 and below (2)</text>
  <rect x="548" y="218" width="14" height="14" rx="3" fill="#F1FDF6"/><text class="key" x="568" y="230">36-45 (2)</text>
  <text class="key" x="0" y="330" style="font-size:13px">Two respondents left age blank; we counted them as 16-25, as in our report.</text>
</svg>
