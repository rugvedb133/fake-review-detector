<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" width="720" height="345" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Age of the survey respondents</title>
  <desc id="d">Doughnut chart. 85.9% of the 156 respondents are aged 16 to 25, which includes 2 who left age blank. The other 14.1% (22 people) are shown in a second doughnut: 7.7% aged 45 and above, 3.8% aged 26 to 35, 1.3% aged 15 and below and 1.3% aged 36 to 45.</desc>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&amp;display=swap");

    :root {
      color-scheme: dark;
    }

    text {
      fill: #F1FDF6;
      font-family: "Oxygen", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }

    .head {
      font-size: 16px;
      font-weight: 700;
    }

    .pct {
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }

    .big {
      font-size: 30px;
      font-weight: 700;
      text-anchor: middle;
    }

    .mid {
      fill: #B9E3CC;
      font-size: 14px;
      text-anchor: middle;
    }

    .key {
      fill: #B9E3CC;
      font-size: 14px;
    }

    .tick {
      fill: #B9E3CC;
      font-size: 13px;
      text-anchor: middle;
    }

    .seg {
      stroke: #072F25;
      stroke-width: 2;
    }

    .grid {
      stroke: #A4EFC1;
      stroke-opacity: 0.18;
    }

    .zero {
      stroke: #B9E3CC;
      stroke-width: 1.5;
    }
  </style>
  <text class="head" x="0" y="22">Age of the 156 respondents</text>
  <g><title>16-25: 134 of 156 (85.9%), including 2 who left age blank</title><path class="seg" d="M268.4 236.4A120 120 0 1 1 268.4 133.6L226.9 153.3A74 74 0 1 0 226.9 216.7Z" fill="#A4EFC1"/></g>
  <g><title>Other ages: 22 of 156 (14.1%)</title><path class="seg" d="M268.4 133.6A120 120 0 0 1 268.4 236.4L226.9 216.7A74 74 0 0 0 226.9 153.3Z" fill="#F7CE8B"/></g>
  <line x1="268.4" y1="133.6" x2="450" y2="109" stroke="#B9E3CC" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="268.4" y1="236.4" x2="450" y2="261" stroke="#B9E3CC" stroke-opacity="0.6" stroke-width="1.5"/>
  <text class="big" x="160" y="193">85.9%</text>
  <text class="mid" x="160" y="215">aged 16-25</text>
  <g><title>45 and above: 12 of 156 (7.7%)</title><path class="seg" d="M450.0 109.0A76 76 0 1 1 428.6 257.9L438.7 223.4A40 40 0 1 0 450.0 145.0Z" fill="#C5D3CD"/><text class="pct" x="507.4" y="197.3" style="fill:#072F25;font-size:12px">7.7%</text></g>
  <g><title>26-35: 6 of 156 (3.8%)</title><path class="seg" d="M428.6 257.9A76 76 0 0 1 380.9 153.4L413.6 168.4A40 40 0 0 0 438.7 223.4Z" fill="#79C3A0"/><text class="pct" x="397.2" y="213.1" style="fill:#072F25;font-size:12px">3.8%</text></g>
  <g><title>15 and below: 2 of 156 (1.3%)</title><path class="seg" d="M380.9 153.4A76 76 0 0 1 408.9 121.1L428.4 151.3A40 40 0 0 0 413.6 168.4Z" fill="#F1FDF6"/><text class="pct" x="406.2" y="151.0" style="fill:#072F25;font-size:11px">1.3%</text></g>
  <g><title>36-45: 2 of 156 (1.3%)</title><path class="seg" d="M408.9 121.1A76 76 0 0 1 450.0 109.0L450.0 145.0A40 40 0 0 0 428.4 151.3Z" fill="#4E9F83"/><text class="pct" x="433.7" y="133.3" style="fill:#072F25;font-size:11px">1.3%</text></g>
  <text class="big" x="450" y="185" style="font-size:22px">14.1%</text>
  <text class="mid" x="450" y="203" style="font-size:13px">other ages</text>
  <rect x="548" y="118" width="14" height="14" rx="3" fill="#F1FDF6"/><text class="key" x="568" y="130">15 and below (2)</text>
  <rect x="548" y="144" width="14" height="14" rx="3" fill="#A4EFC1"/><text class="key" x="568" y="156">16-25 (134)</text>
  <rect x="548" y="170" width="14" height="14" rx="3" fill="#79C3A0"/><text class="key" x="568" y="182">26-35 (6)</text>
  <rect x="548" y="196" width="14" height="14" rx="3" fill="#4E9F83"/><text class="key" x="568" y="208">36-45 (2)</text>
  <rect x="548" y="222" width="14" height="14" rx="3" fill="#C5D3CD"/><text class="key" x="568" y="234">45 and above (12)</text>
  <text class="key" x="0" y="330" style="font-size:13px">Two respondents left age blank; we counted them as 16-25, as in our report.</text>
</svg>