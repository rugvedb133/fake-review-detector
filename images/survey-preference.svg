<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 15 430 240" width="430" height="240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Preferred review type</title>
  <desc id="d">Pie chart of 156 respondents. 69.9% prefer text reviews and 30.1% prefer star ratings when deciding what to buy.</desc>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&amp;display=swap");

    :root {
      color-scheme: dark;
    }

    text {
      fill: #F1FDF6;
      font-family: "Oxygen", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }

    .head {
      font-size: 16px;
      font-weight: 700;
    }

    .pct {
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }

    .big {
      font-size: 30px;
      font-weight: 700;
      text-anchor: middle;
    }

    .mid {
      fill: #B9E3CC;
      font-size: 14px;
      text-anchor: middle;
    }

    .key {
      fill: #B9E3CC;
      font-size: 14px;
    }

    .tick {
      fill: #B9E3CC;
      font-size: 13px;
      text-anchor: middle;
    }

    .seg {
      stroke: #072F25;
      stroke-width: 2;
    }

    .grid {
      stroke: #A4EFC1;
      stroke-opacity: 0.18;
    }

    .zero {
      stroke: #B9E3CC;
      stroke-width: 1.5;
    }
  </style>
  <text class="head" x="40" y="32">Which review type do you prefer when deciding?</text>
  <g><title>Text review: 109 of 156 (69.9%)</title><path class="seg" d="M130 145L130.0 50.0A95 95 0 1 1 39.9 175.1Z" fill="#A4EFC1"/></g>
  <g><title>Star rating: 47 of 156 (30.1%)</title><path class="seg" d="M130 145L39.9 175.1A95 95 0 0 1 130.0 50.0Z" fill="#4E9F83"/></g>
  <text class="pct" x="177.1" y="183.9" style="fill:#072F25">69.9%</text>
  <text class="pct" x="82.9" y="116.1" style="fill:#072F25">30.1%</text>
