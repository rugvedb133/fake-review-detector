  <line class="grid" x1="565.7" x2="565.7" y1="162" y2="206"/>
  <line class="grid" x1="668.6" x2="668.6" y1="162" y2="206"/>
  <g><title>Rating 3: 57 of 156 (36.5%)</title><rect class="seg" x="163.2" y="166" width="187.9" height="36" fill="#C5D3CD"/></g>
  <g><title>Rating 2: 23 of 156 (14.7%)</title><rect class="seg" x="87.4" y="166" width="75.8" height="36" fill="#F7CE8B"/></g>
  <g><title>Rating 1: 6 of 156 (3.8%)</title><rect class="seg" x="67.6" y="166" width="19.8" height="36" fill="#E0962B"/></g>
  <g><title>Rating 4: 58 of 156 (37.2%)</title><rect class="seg" x="351.1" y="166" width="191.2" height="36" fill="#79C3A0"/></g>
  <g><title>Rating 5: 12 of 156 (7.7%)</title><rect class="seg" x="542.3" y="166" width="39.6" height="36" fill="#3FA37F"/></g>
  <text class="pct" x="125.3" y="189" style="fill:#072F25">14.7%</text>
  <text class="pct" x="257.1" y="189" style="fill:#072F25">36.5%</text>
  <text class="pct" x="446.7" y="189" style="fill:#072F25">37.2%</text>
  <text x="0" y="241">How likely are you to answer</text>
  <text x="0" y="261">&#x27;Did you find this review useful?&#x27;</text>
  <line class="grid" x1="51.4" x2="51.4" y1="270" y2="314"/>
  <line class="grid" x1="154.3" x2="154.3" y1="270" y2="314"/>
  <line class="zero" x1="257.1" x2="257.1" y1="270" y2="314"/>
  <line class="grid" x1="360.0" x2="360.0" y1="270" y2="314"/>
  <line class="grid" x1="462.9" x2="462.9" y1="270" y2="314"/>
  <line class="grid" x1="565.7" x2="565.7" y1="270" y2="314"/>
  <line class="grid" x1="668.6" x2="668.6" y1="270" y2="314"/>
  <g><title>Rating 3: 44 of 156 (28.2%)</title><rect class="seg" x="184.6" y="274" width="145.1" height="36" fill="#C5D3CD"/></g>
  <g><title>Rating 2: 26 of 156 (16.7%)</title><rect class="seg" x="98.9" y="274" width="85.7" height="36" fill="#F7CE8B"/></g>
  <g><title>Rating 1: 24 of 156 (15.4%)</title><rect class="seg" x="19.8" y="274" width="79.1" height="36" fill="#E0962B"/></g>
  <g><title>Rating 4: 42 of 156 (26.9%)</title><rect class="seg" x="329.7" y="274" width="138.5" height="36" fill="#79C3A0"/></g>
  <g><title>Rating 5: 20 of 156 (12.8%)</title><rect class="seg" x="468.1" y="274" width="65.9" height="36" fill="#3FA37F"/></g>
  <text class="pct" x="59.3" y="297" style="fill:#072F25">15.4%</text>
