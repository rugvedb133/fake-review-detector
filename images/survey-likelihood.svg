  <text class="pct" x="257.1" y="297" style="fill:#072F25">28.2%</text>
  <text class="pct" x="398.9" y="297" style="fill:#072F25">26.9%</text>
  <text class="pct" x="501.1" y="297" style="fill:#072F25">12.8%</text>
  <text class="tick" x="51.4" y="338">40%</text>
  <text class="tick" x="154.3" y="338">20%</text>
  <text class="tick" x="257.1" y="338">0%</text>
  <text class="tick" x="360.0" y="338">20%</text>
