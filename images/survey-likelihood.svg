<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" width="720" height="382" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">How much reviews matter to shoppers</title>
  <desc id="d">Diverging bars from 156 respondents on a 1 to 5 scale, centred on the neutral rating 3. 73.7% rated their likelihood of deciding from reviews 4 or 5, against 3.2% who rated it 1 or 2. 44.9% rated how often reviews focus on the brand rather than the product 4 or 5. 39.7% rated their likelihood of answering &#x27;Did you find this review useful?&#x27; 4 or 5, and 32.1% rated it 1 or 2.</desc>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&amp;display=swap");

    :root {
      color-scheme: dark;
    }

    text {
      fill: #F1FDF6;
      font-family: "Oxygen", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }

    .head {
      font-size: 16px;
      font-weight: 700;
    }

    .pct {
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }

    .big {
      font-size: 30px;
      font-weight: 700;
      text-anchor: middle;
    }

    .mid {
      fill: #B9E3CC;
      font-size: 14px;
      text-anchor: middle;
    }

    .key {
      fill: #B9E3CC;
      font-size: 14px;
    }

    .tick {
      fill: #B9E3CC;
      font-size: 13px;
      text-anchor: middle;
    }

    .seg {
      stroke: #072F25;
      stroke-width: 2;
    }

    .grid {
      stroke: #A4EFC1;
      stroke-opacity: 0.18;
    }

    .zero {
      stroke: #B9E3CC;
      stroke-width: 1.5;
    }
  </style>
  <text x="0" y="25">How likely are you to make a buying decision</text>
  <text x="0" y="45">based on reviews?</text>
  <line class="grid" x1="51.4" x2="51.4" y1="54" y2="98"/>
  <line class="grid" x1="154.3" x2="154.3" y1="54" y2="98"/>
  <line class="zero" x1="257.1" x2="257.1" y1="54" y2="98"/>
  <line class="grid" x1="360.0" x2="360.0" y1="54" y2="98"/>
  <line class="grid" x1="462.9" x2="462.9" y1="54" y2="98"/>
  <line class="grid" x1="565.7" x2="565.7" y1="54" y2="98"/>
  <line class="grid" x1="668.6" x2="668.6" y1="54" y2="98"/>
  <g><title>Rating 3: 36 of 156 (23.1%)</title><rect class="seg" x="197.8" y="58" width="118.7" height="36" fill="#C5D3CD"/></g>
  <g><title>Rating 2: 5 of 156 (3.2%)</title><rect class="seg" x="181.3" y="58" width="16.5" height="36" fill="#F7CE8B"/></g>
  <g><title>Rating 4: 79 of 156 (50.6%)</title><rect class="seg" x="316.5" y="58" width="260.4" height="36" fill="#79C3A0"/></g>
  <g><title>Rating 5: 36 of 156 (23.1%)</title><rect class="seg" x="576.9" y="58" width="118.7" height="36" fill="#3FA37F"/></g>
  <text class="pct" x="257.1" y="81" style="fill:#072F25">23.1%</text>
  <text class="pct" x="446.7" y="81" style="fill:#072F25">50.6%</text>
  <text class="pct" x="636.3" y="81" style="fill:#072F25">23.1%</text>
  <text x="0" y="133">How often do you see reviews that focus on</text>
  <text x="0" y="153">the brand more than the product?</text>
  <line class="grid" x1="51.4" x2="51.4" y1="162" y2="206"/>
  <line class="grid" x1="154.3" x2="154.3" y1="162" y2="206"/>
  <line class="zero" x1="257.1" x2="257.1" y1="162" y2="206"/>
  <line class="grid" x1="360.0" x2="360.0" y1="162" y2="206"/>
