  <rect x="217.2" y="360" width="14" height="14" rx="3" fill="#79C3A0"/><text class="key" x="237.2" y="372">4</text>
  <rect x="266.8" y="360" width="14" height="14" rx="3" fill="#3FA37F"/><text class="key" x="286.8" y="372">5 (highest)</text>
</svg>
