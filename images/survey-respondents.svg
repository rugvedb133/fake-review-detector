<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 246" width="720" height="246" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Who answered the survey</title>
  <desc id="d">Stacked bars. Of 154 respondents who gave an age, 85.7% were 16 to 25, 7.8% were 45 and above, 3.9% were 26 to 35, 1.3% were 36 to 45 and 1.3% were 15 and below. Of all 156, 69.9% preferred text reviews and 30.1% preferred star ratings.</desc>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&amp;display=swap");

    :root {
      color-scheme: dark;
    }

    text {
      fill: #F1FDF6;
      font-family: "Oxygen", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }

    .seg {
      stroke: #072F25;
      stroke-width: 2;
    }

    .pct {
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }

    .key {
      fill: #B9E3CC;
      font-size: 14px;
    }
  </style>
  <text x="0" y="25">Age group (154 of 156 answered)</text>
  <g><title>15 and below: 2 of 154 (1.3%)</title><rect class="seg" x="0.0" y="38" width="9.4" height="40" rx="4" fill="#2F7F67"/>
  </g>
  <g><title>16-25: 132 of 154 (85.7%)</title><rect class="seg" x="9.4" y="38" width="617.1" height="40" rx="4" fill="#4E9F83"/>
  <text class="pct" x="317.9" y="63" fill="#072F25" style="fill:#072F25">85.7%</text>
  </g>
  <g><title>26-35: 6 of 154 (3.9%)</title><rect class="seg" x="626.5" y="38" width="28.1" height="40" rx="4" fill="#79C3A0"/>
  </g>
  <g><title>36-45: 2 of 154 (1.3%)</title><rect class="seg" x="654.5" y="38" width="9.4" height="40" rx="4" fill="#A4EFC1"/>
  </g>
  <g><title>45 and above: 12 of 154 (7.8%)</title><rect class="seg" x="663.9" y="38" width="56.1" height="40" rx="4" fill="#F1FDF6"/>
  <text class="pct" x="691.9" y="63" fill="#072F25" style="fill:#072F25">7.8%</text>
  </g>
  <rect x="0" y="88" width="14" height="14" rx="3" fill="#2F7F67"/><text class="key" x="20" y="100">15 and below</text>
  <rect x="133.2" y="88" width="14" height="14" rx="3" fill="#4E9F83"/><text class="key" x="153.2" y="100">16-25</text>
  <rect x="213.2" y="88" width="14" height="14" rx="3" fill="#79C3A0"/><text class="key" x="233.2" y="100">26-35</text>
  <rect x="293.2" y="88" width="14" height="14" rx="3" fill="#A4EFC1"/><text class="key" x="313.2" y="100">36-45</text>
  <rect x="373.2" y="88" width="14" height="14" rx="3" fill="#F1FDF6"/><text class="key" x="393.2" y="100">45 and above</text>
  <text x="0" y="143">Which review type do you prefer when deciding?</text>
  <g><title>Text review: 109 of 156 (69.9%)</title><rect class="seg" x="0.0" y="156" width="503.1" height="40" rx="4" fill="#A4EFC1"/>
  <text class="pct" x="251.5" y="181" fill="#072F25" style="fill:#072F25">69.9%</text>
  </g>
  <g><title>Star rating: 47 of 156 (30.1%)</title><rect class="seg" x="503.1" y="156" width="216.9" height="40" rx="4" fill="#79C3A0"/>
  <text class="pct" x="611.5" y="181" fill="#072F25" style="fill:#072F25">30.1%</text>
  </g>
  <rect x="0" y="206" width="14" height="14" rx="3" fill="#A4EFC1"/><text class="key" x="20" y="218">Text review</text>
  <rect x="125.6" y="206" width="14" height="14" rx="3" fill="#79C3A0"/><text class="key" x="145.6" y="218">Star rating</text>
</svg>
