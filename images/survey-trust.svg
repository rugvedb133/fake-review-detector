<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 720 216" width="720" height="216" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Shoppers suspect fake and spiteful reviews</title>
  <desc id="d">Stacked bars from 156 survey respondents. 60.9% have felt some positive reviews were posted on behalf of the company, 4.5% have not, and 34.6% said maybe. 51.3% have seen reviews written out of spite, 18.6% have not, and 30.1% said maybe.</desc>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&amp;display=swap");

    :root {
      color-scheme: dark;
    }

    text {
      fill: #F1FDF6;
      font-family: "Oxygen", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }

    .head {
      font-size: 16px;
      font-weight: 700;
    }

    .pct {
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }

    .big {
      font-size: 30px;
      font-weight: 700;
      text-anchor: middle;
    }

    .mid {
      fill: #B9E3CC;
      font-size: 14px;
      text-anchor: middle;
    }

    .key {
      fill: #B9E3CC;
      font-size: 14px;
    }

    .tick {
      fill: #B9E3CC;
      font-size: 13px;
      text-anchor: middle;
    }

    .seg {
      stroke: #072F25;
      stroke-width: 2;
    }

    .grid {
      stroke: #A4EFC1;
      stroke-opacity: 0.18;
    }

    .zero {
      stroke: #B9E3CC;
      stroke-width: 1.5;
    }
  </style>
  <text x="0" y="25">Ever felt some positive reviews were posted on behalf of the company?</text>
  <g><title>Yes: 95 of 156 (60.9%)</title><rect class="seg" x="0.0" y="38" width="438.5" height="40" rx="4" fill="#FFC15E"/>
  <text class="pct" x="219.2" y="63" style="fill:#072F25;font-size:14px">60.9%</text>
  </g>
  <g><title>No: 7 of 156 (4.5%)</title><rect class="seg" x="438.5" y="38" width="32.3" height="40" rx="4" fill="#A4EFC1"/>
  <text class="pct" x="454.6" y="63" style="fill:#072F25; font-size:11px">4.5%</text>
  </g>
  <g><title>Maybe: 54 of 156 (34.6%)</title><rect class="seg" x="470.8" y="38" width="249.2" height="40" rx="4" fill="#4E9F83"/>
  <text class="pct" x="595.4" y="63" style="fill:#072F25;font-size:14px">34.6%</text>
  </g>
  <text x="0" y="127">Ever come across reviews that seemed written out of spite towards the company?</text>
  <g><title>Yes: 80 of 156 (51.3%)</title><rect class="seg" x="0.0" y="140" width="369.2" height="40" rx="4" fill="#FFC15E"/>
  <text class="pct" x="184.6" y="165" style="fill:#072F25;font-size:14px">51.3%</text>
  </g>
  <g><title>No: 29 of 156 (18.6%)</title><rect class="seg" x="369.2" y="140" width="133.8" height="40" rx="4" fill="#A4EFC1"/>
  <text class="pct" x="436.2" y="165" style="fill:#072F25;font-size:14px">18.6%</text>
  </g>
  <g><title>Maybe: 47 of 156 (30.1%)</title><rect class="seg" x="503.1" y="140" width="216.9" height="40" rx="4" fill="#4E9F83"/>
  <text class="pct" x="611.5" y="165" style="fill:#072F25;font-size:14px">30.1%</text>
  </g>
  <rect x="0" y="206" width="14" height="14" rx="3" fill="#FFC15E"/><text class="key" x="20" y="218">Yes</text>
  <rect x="64.8" y="206" width="14" height="14" rx="3" fill="#A4EFC1"/><text class="key" x="84.8" y="218">No</text>
  <rect x="122.0" y="206" width="14" height="14" rx="3" fill="#4E9F83"/><text class="key" x="142.0" y="218">Maybe</text>
</svg>